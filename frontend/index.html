<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Shop</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body data-page="home">
    <div class="page-shell store-shell">
        <header class="store-header">
            <div class="store-header-inner">
                <a class="brand" href="/">Mini Shop</a>
                <form id="global-search" class="store-search">
                    <input id="global-search-input" placeholder="Search products" autocomplete="off" maxlength="150">
                </form>
                <nav id="main-nav" class="nav"></nav>
            </div>
        </header>
        <main class="content">
            <section class="store-hero">
                <div>
                    <h1>Welcome to Mini Shop</h1>
                    <p>Browse simple and useful products for everyday work and life.</p>
                    <a class="button-link" href="/products">Browse Products</a>
                </div>
            </section>
            <section class="products-section">
                <div class="header-row section-header">
                    <div>
                        <h2>Latest Products</h2>
                        <div class="muted">A quick look at what is new in the catalog.</div>
                    </div>
                    <a class="button-link secondary-link" href="/products">View Catalog</a>
                </div>
                <div id="page-message" class="message"></div>
                <div id="home-products" class="card-grid"></div>
            </section>
        </main>
        <footer class="store-footer">Mini Shop - Customer storefront</footer>
    </div>
    <script src="/static/js/shop.js"></script>
</body>
</html>
