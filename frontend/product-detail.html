<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Detail | Mini Shop</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body data-page="product-detail">
    <div class="page-shell store-shell">
        <header class="store-header">
            <div class="store-header-inner">
                <a class="brand" href="/">Mini Shop</a>
                <form id="global-search" class="store-search">
                    <input id="global-search-input" placeholder="Search products" autocomplete="off" maxlength="150">
                </form>
                <nav id="main-nav" class="nav"></nav>
            </div>
        </header>
        <main class="content">
            <div id="page-message" class="message"></div>
            <section id="product-detail" class="detail-panel product-detail-layout"></section>
        </main>
        <footer class="store-footer">Mini Shop - Product detail</footer>
    </div>
    <script src="/static/js/shop.js"></script>
</body>
</html>
