<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Products | Mini Shop</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body data-admin-page="products">
    <div class="admin-shell">
        <aside class="admin-sidebar"><a class="brand" href="/admin/dashboard">Mini Shop Admin</a><nav id="admin-nav" class="admin-nav"></nav></aside>
        <div class="admin-main">
            <header class="admin-topbar"><div id="admin-name" class="muted"></div></header>
            <main class="content">
                <div class="header-row section-header"><div><h1>Products</h1><div id="summary" class="muted"></div></div><button id="add-button" type="button">Add Product</button></div>
                <section class="toolbar" aria-label="Product tools"><input id="search-input" placeholder="Search name or SKU" autocomplete="off" maxlength="150"><button id="search-button" class="secondary" type="button">Search</button></section>
                <section class="table-panel"><div class="table-wrap"><table><thead><tr><th>Image</th><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="product-rows"></tbody></table></div><div class="pagination"><button id="prev-page" class="secondary" type="button">Previous</button><span id="page-info" class="muted"></span><button id="next-page" class="secondary" type="button">Next</button></div></section>
            </main>
        </div>
    </div>
    <div id="dialog-backdrop" class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h1 id="dialog-title">Product</h1><form id="product-form" class="form-stack"><div class="form-grid"><label>Name <input id="name" name="name" maxlength="150" required></label><label>SKU <input id="sku" name="sku" maxlength="50" required></label><label>Price <input id="price" name="price" type="number" min="0" max="999999999" step="0.01" required></label><label>Quantity <input id="quantity" name="quantity" type="number" min="0" max="1000000" step="1" required></label><label class="full">Product Image <span class="image-picker"><img id="image-preview" class="image-preview" src="/static/images/product-placeholder.png" alt="Product preview"><input id="image-file" name="image_file" type="file" accept="image/png,image/jpeg,image/webp"></span></label><label class="full">Description <textarea id="description" name="description" maxlength="1000"></textarea><span id="description-counter" class="field-hint">0 / 1000</span></label></div><div id="form-message" class="message"></div><div class="form-actions"><button id="cancel-button" class="secondary" type="button">Cancel</button><button id="save-button" type="submit">Save</button></div></form></section></div>
    <script src="/static/js/admin.js"></script>
</body>
</html>
